version: 2

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - gocyclo
    - prealloc
  settings:
    gosec:
      excludes:
        - G117 # Exported struct field "Secret","ApiKey","AccessKey","AccessToken","ClientSecret" (JSON key "Secret") matches secret pattern
        - G304 # Potential file inclusion via variable redisHolder.go:159
        - G402 # TLS InsecureSkipVerify may be set to true. redisHolder.go:172
        - G115 # integer overflow conversion int64 -> uint64
        - G124 #  http.Cookie missing or has insecure Secure, HttpOnly, or SameSite attribute
    staticcheck:
      checks:
        - -QF1008
  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - unused
run:
  concurrency: 4
  timeout: 5m