version: "2"

run:
  concurrency: 4
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - prealloc
    - gosec
    - bidichk
    - errorlint
    - exhaustive
    - bodyclose
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - makezero
    - reassign
    - fatcontext
    - copyloopvar
    - unconvert
    - wastedassign
    - nolintlint
  settings:
    gosec:
      excludes:
        - G117 # Exported struct field "Secret","ApiKey","AccessKey","AccessToken","ClientSecret" (JSON key "Secret") matches secret pattern
        - G304 # Potential file inclusion via variable redisHolder.go:159
        - G402 # TLS InsecureSkipVerify may be set to true. redisHolder.go:172
        - G115 # integer overflow conversion int64 -> uint64
        - G124 #  http.Cookie missing or has insecure Secure, HttpOnly, or SameSite attribute
    staticcheck:
      checks:
        - -QF1008
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true

  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0